name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify-core:
    name: Verify Core (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  integration-e2e:
    name: Integration & E2E (Node 22)
    runs-on: ubuntu-latest
    needs: verify-core
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: npm run test:integration
      - run: npm run test:e2e
