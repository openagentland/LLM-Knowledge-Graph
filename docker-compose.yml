services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "${LLM_KG_QDRANT_PORT:-16333}:6333"
      - "${LLM_KG_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${LLM_KG_OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        sleep 10
        ollama pull nomic-embed-text
        ollama pull qwen2.5:1.5b-instruct-q4_K_M
        wait
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "ollama list | grep -E 'nomic-embed-text|qwen2.5:1.5b-instruct-q4_K_M'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  qdrant:
  ollama:
  neo4j_data:
  neo4j_logs:
